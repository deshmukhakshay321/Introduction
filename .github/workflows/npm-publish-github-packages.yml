name: Greetings on variable day

on:
  workflow_dispatch
env:
  DAY: Monday
jobs:
  greeting_job:
  runs-on: ubuntu-latest 
  env: 
    greeting: Hello
  steps:
    -name : "Say Hello Mona it's Monday"
    run: echo "$greeeting $name. Today is $DAY "
    env:
      name: Mona
