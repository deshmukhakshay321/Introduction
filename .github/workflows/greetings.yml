
name: Greetings on variable day

on:
  workflow_dispatch:

env:
  DAYof: Monday

jobs:
  greeting_job:
    runs-on: ubuntu-latest
    env:
      greeting: Hello

    steps:
      - name: "Say Hello Mona it's Monday"
        run: echo "$greeting $name. Today is $DAYof"
        env:
          name: Mona
